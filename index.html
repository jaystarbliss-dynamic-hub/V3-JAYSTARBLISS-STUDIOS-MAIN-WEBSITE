  <body>
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister();
              });
            }).catch(function () {});
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                if (key.indexOf('workbox') !== -1 || key.indexOf('precache') !== -1) {
                  caches.delete(key);
                }
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <div id="jb-boot-splash" role="status" aria-label="Loading">
        <div class="jb-boot-wrap">
          <span class="jb-boot-halo" aria-hidden="true"></span>
          <span class="jb-boot-ring" aria-hidden="true"></span>
          <div class="jb-boot-logo-circle">
            <img src="/logo.png" alt="Jaystarbliss Studios" onerror="this.onerror=null;this.src='/favicon.png';" />
          </div>
        </div>
        <style>
          #jb-boot-splash {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 24px;
          }
          @media (prefers-color-scheme: dark) {
            #jb-boot-splash { background: #0d0f17; }
          }
          .jb-boot-wrap {
            position: relative;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          .jb-boot-halo {
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background: conic-gradient(from 0deg, rgba(255,36,66,0.36), rgba(37,99,235,0.36), rgba(56,189,248,0.28), rgba(223,70,39,0.36), rgba(255,36,66,0.36));
            filter: blur(10px);
            opacity: 0.55;
            animation: jbBootSpin 4.8s linear infinite, jbBootBreathe 2.4s ease-in-out infinite;
          }
          .jb-boot-ring {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: conic-gradient(from 0deg, #ff2442 0deg, #df4627 65deg, #2563eb 155deg, #38bdf8 225deg, #b91c1c 305deg, #ff2442 360deg);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 1.5px));
            animation: jbBootSpin 4.8s linear infinite;
          }
          .jb-boot-logo-circle {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 9999px;
            overflow: hidden;
            background: #0b1130;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
            animation: jbBootBreathe 2.4s ease-in-out infinite;
          }
          .jb-boot-logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 9999px;
            display: block;
          }
          @keyframes jbBootBreathe {
            0%, 100% { transform: scale(0.93); opacity: 0.92; }
            50% { transform: scale(1.045); opacity: 1; }
          }
          @keyframes jbBootSpin {
            0% { transform: rotate(0deg); animation-timing-function: cubic-bezier(0.75, 0, 0.25, 1); }
            32% { transform: rotate(720deg); animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
            66% { transform: rotate(840deg); animation-timing-function: cubic-bezier(0.78, 0, 0.22, 1); }
            100% { transform: rotate(1440deg); }
          }
        </style>
        <script>
          (function () {
            try {
              var saved = localStorage.getItem('jaystarbliss_theme') || localStorage.getItem('theme');
              var splash = document.getElementById('jb-boot-splash');
              if (splash && saved === 'dark') {
                splash.style.background = '#0d0f17';
              } else if (splash && saved === 'light') {
                splash.style.background = '#f8fafc';
              }
            } catch (e) {}
          })();
        </script>
      </div>
