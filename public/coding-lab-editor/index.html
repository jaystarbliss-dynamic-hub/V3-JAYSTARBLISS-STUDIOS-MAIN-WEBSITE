<!doctype html>
<html data-coding-lab-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2,user-scalable=yes">
  <meta name="google" value="notranslate">
  <link rel="shortcut icon" href="static/favicon.ico">
  <title>Coding Lab</title>
  <script>
    (function () {
      var VALID_THEMES = { light: true, dark: true, glass: true };
      var params = new URLSearchParams(window.location.search);
      var initialTheme = params.get('theme');
      if (!VALID_THEMES[initialTheme]) initialTheme = 'light';
      var expectedNonce = params.get('nonce') || '';

      function applyTheme(nextTheme) {
        if (!VALID_THEMES[nextTheme]) return;
        document.documentElement.dataset.codingLabTheme = nextTheme;
      }
      applyTheme(initialTheme);

      function postAck() {
        if (!window.parent || window.parent === window) return;
        try {
          window.parent.postMessage(
            {
              type: 'CODING_LAB_HANDSHAKE_ACK',
              nonce: expectedNonce,
              theme: document.documentElement.dataset.codingLabTheme || 'light',
            },
            window.location.origin
          );
        } catch (e) {
          // Ignore if parent frame is navigating
        }
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        if (event.source !== window.parent) return;
        var msg = event.data;
        if (!msg || typeof msg !== 'object' || typeof msg.type !== 'string') return;
        if (expectedNonce && msg.nonce && msg.nonce !== expectedNonce) return;

        if (msg.type === 'CODING_LAB_SET_THEME') {
          if (expectedNonce && msg.nonce !== expectedNonce) return;
          applyTheme(msg.theme);
          return;
        }
        if (msg.type === 'CODING_LAB_HANDSHAKE_INIT') {
          if (expectedNonce && msg.nonce !== expectedNonce) return;
          postAck();
        }
      });

      window.addEventListener('DOMContentLoaded', postAck);
    })();
  </script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: auto !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      background: #f5f7fb;
      font-family: "Helvetica Neue", Helvetica, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @media (max-width: 1180px), (max-height: 680px) {
      .app,
      [class*="gui_page-wrapper"],
      [class*="gui_body-wrapper"] {
        overflow: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      [class*="gui_page-wrapper"] {
        min-width: 1024px !important;
        min-height: 640px !important;
      }
    }

    /* =====================================================================
       TURBOWARP ADDON CONTROLS (Pause Button, Find Ctrl+F Bar, Status Chips)
       ===================================================================== */
    .tw-pause-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0.25rem;
      margin: 0 0.125rem;
      border: none;
      border-radius: 0.25rem;
      background: transparent;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease;
    }
    .tw-pause-btn:hover {
      background-color: rgba(255, 174, 0, 0.18);
    }
    .tw-pause-btn.tw-pause-active {
      background-color: rgba(255, 174, 0, 0.28);
      box-shadow: inset 0 0 0 1px rgba(255, 174, 0, 0.55);
    }

    .tw-runtime-badges {
      display: none;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
    }
    .tw-status-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.01em;
      user-select: none;
    }
    .tw-chip-turbo {
      background: rgba(255, 171, 25, 0.18);
      color: #d97706;
      border: 1px solid rgba(255, 171, 25, 0.45);
    }
    .tw-chip-fps {
      background: rgba(255, 76, 76, 0.14);
      color: #dc2626;
      border: 1px solid rgba(255, 76, 76, 0.35);
    }

    .tw-find-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-left: 14px;
      align-self: center;
      z-index: 45;
    }
    .tw-find-input {
      width: 170px;
      height: 28px;
      padding: 0 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.16);
      background: #ffffff;
      color: #1f2937;
      font-size: 12px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, width 0.18s ease;
    }
    .tw-find-input:focus {
      width: 220px;
      border-color: #ff4c4c;
      box-shadow: 0 0 0 2px rgba(255, 76, 76, 0.22);
    }
    .tw-find-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 280px;
      max-height: 280px;
      overflow-y: auto;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      padding: 4px;
      z-index: 999;
    }
    .tw-find-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #1f2937;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .tw-find-item:hover {
      background: rgba(255, 76, 76, 0.12);
    }
    .tw-find-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .tw-find-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tw-find-empty {
      padding: 8px 10px;
      font-size: 11px;
      color: #6b7280;
    }
    @keyframes twFindPulse {
      0%, 100% { filter: none; }
      30%, 70% { filter: drop-shadow(0 0 10px #ff4c4c); }
    }
    .tw-find-pulse {
      animation: twFindPulse 0.9s ease-in-out 2;
    }
